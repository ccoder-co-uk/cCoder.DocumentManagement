# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_DIRECTORY: ${{ github.workspace }}/artifacts/nuget
  TEST_RESULTS_DIRECTORY: ${{ github.workspace }}/artifacts/test-results
  DOTNET_CLI_DISABLE_PERSISTENT_MSBUILD_SERVER: true

defaults:
  run:
    shell: pwsh

jobs:
  build-test-pack:
    runs-on: [self-hosted, Windows, X64, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create version number
        id: version
        run: |
          "value=$(Get-Date -Format 'yyyy.M.d.HHmm')" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          $restoreOutput = & dotnet restore src/cCoder.DocumentManagement.slnx 2>&1
          $restoreExitCode = $LASTEXITCODE
          $restoreText = $restoreOutput -join [Environment]::NewLine
          $restoreText | Write-Output

          if ($restoreExitCode -ne 0) {
            if ($restoreText -notmatch 'NU1102') {
              exit $restoreExitCode
            }

            Write-Warning 'A required package is not yet visible through the local NuGet HTTP cache; clearing it and retrying once.'
            dotnet nuget locals http-cache --clear
            dotnet restore src/cCoder.DocumentManagement.slnx --no-http-cache
          }

      - name: Build
        # Multiple solution branches reference the same library output. Keep compilation
        # serialized to avoid concurrent writers on the persistent Windows runner.
        run: dotnet build src/cCoder.DocumentManagement.slnx -c Release --no-restore -m:1 /p:BuildInParallel=false /p:UseSharedCompilation=false /p:Version="${{ steps.version.outputs.value }}" --verbosity minimal

      - name: Test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: dotnet test src/cCoder.DocumentManagement.slnx -c Release --no-build --verbosity minimal

      - name: Test and collect coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet test src/cCoder.DocumentManagement.slnx -c Release --no-build --verbosity minimal --settings coverage.runsettings --results-directory "${{ env.TEST_RESULTS_DIRECTORY }}" --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test and coverage results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.TEST_RESULTS_DIRECTORY }}

      - name: Pack
        run: |
          New-Item -ItemType Directory -Path "${{ env.NUGET_DIRECTORY }}" -Force | Out-Null
          dotnet pack src/cCoder.DocumentManagement/cCoder.DocumentManagement.csproj -c Release --no-build --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}" --verbosity minimal

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.NUGET_DIRECTORY }}/*.nupkg
            !${{ env.NUGET_DIRECTORY }}/*.snupkg

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        run: |
          foreach ($file in (Get-ChildItem "${{ env.NUGET_DIRECTORY }}" -Filter *.nupkg)) {
            dotnet nuget push $file.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

  coverage-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download test and coverage results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: test-results

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install ReportGenerator
        run: dotnet tool install --tool-path tools dotnet-reportgenerator-globaltool --version 5.5.10

      - name: Generate coverage report
        run: |
          tools/reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          touch coverage-report/.nojekyll

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage-report
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage-report

      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
